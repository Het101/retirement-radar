# End-of-support dates Retirement Radar checks against.
# Every section links its source. Found a wrong or missing date? Open a PR with the source link.
#
# Conventions
#   standard:  end of standard support. After it, the service bills extended support (or deprecates).
#   extended:  end of extended support. After it, AWS upgrades the resource for you.
#   A version listed with no dates ({} or null) is current: no end of support announced yet.
#   A version that is not listed at all shows up as "unknown", never as fine.
updated: "2026-10-05"

eks:
  source: https://docs.aws.amazon.com/eks/latest/userguide/kubernetes-versions.html
  # Standard support is 14 months, then 12 months of extended support, then a forced control-plane upgrade.
  cost: Extended support costs $0.60 instead of $0.10 per cluster-hour, about $365 a month extra per cluster.
  monthlyCost: 365
  versions:
    "1.23": { standard: "2023-10-11", extended: "2024-10-11" }
    "1.24": { standard: "2024-01-31", extended: "2025-01-31" }
